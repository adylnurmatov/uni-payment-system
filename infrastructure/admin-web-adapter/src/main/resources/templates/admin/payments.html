<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="ru">
<head th:replace="~{admin/fragments :: head('Платежи')}"></head>
<body>
<nav th:replace="~{admin/fragments :: navbar}"></nav>
<main class="container">
    <div th:replace="~{admin/fragments :: alerts}"></div>

    <div class="d-flex flex-wrap justify-content-between align-items-end gap-3 mb-3">
        <h1 class="h4 mb-0">Платежи <small class="text-muted fs-6" th:text="'(' + ${result.totalElements()} + ')'"></small></h1>
        <form th:action="@{/admin/payments}" method="get" class="d-flex gap-2">
            <select class="form-select form-select-sm" name="status" onchange="this.form.submit()" style="width: 220px">
                <option value="">Все статусы</option>
                <option th:each="s : ${statuses}" th:value="${s}" th:text="${s}"
                        th:selected="${s == selectedStatus}"></option>
            </select>
        </form>
    </div>

    <div class="card">
        <div class="table-responsive">
            <table class="table table-hover mb-0">
                <thead class="table-light">
                <tr>
                    <th>Создан</th>
                    <th>Мерчант</th>
                    <th>Клиент</th>
                    <th class="text-end">Сумма, ETH</th>
                    <th>Статус</th>
                    <th>Транзакция</th>
                    <th></th>
                </tr>
                </thead>
                <tbody>
                <tr th:if="${#lists.isEmpty(result.items())}">
                    <td colspan="7" class="text-center text-muted py-4">Платежей нет</td>
                </tr>
                <tr th:each="row : ${result.items()}" th:with="p=${row.payment()}">
                    <td class="small text-nowrap" th:text="${@ui.time(p.createdAt())}"></td>
                    <td th:text="${row.merchantName()}">Shop</td>
                    <td th:text="${p.clientExternalId()}">ext-42</td>
                    <td class="text-end mono" th:text="${@ui.amount(p.amount())}">0.001</td>
                    <td>
                        <span class="badge" th:classappend="${@ui.badge(p.status())}" th:text="${p.status()}">PENDING</span>
                        <div th:if="${p.failureCode()}" class="small text-danger" th:text="${p.failureCode()}"></div>
                    </td>
                    <td>
                        <a th:if="${@ui.isWebLink(@ui.txUrl(p.txHash()))}" th:href="${@ui.txUrl(p.txHash())}"
                           target="_blank" class="mono" th:text="${@ui.shortHex(p.txHash())}"></a>
                        <span th:unless="${@ui.isWebLink(@ui.txUrl(p.txHash()))}" class="mono text-muted"
                              th:text="${@ui.shortHex(p.txHash())}"></span>
                    </td>
                    <td class="text-end">
                        <a class="btn btn-sm btn-outline-secondary" th:href="@{/admin/payments/{id}(id=${p.id()})}">Открыть</a>
                    </td>
                </tr>
                </tbody>
            </table>
        </div>
    </div>

    <nav class="mt-3" th:if="${result.totalPages() > 1}">
        <ul class="pagination pagination-sm">
            <li class="page-item" th:classappend="${result.page() == 0} ? 'disabled'">
                <a class="page-link" th:href="@{/admin/payments(status=${selectedStatus},page=${result.page() - 1})}">&larr;</a>
            </li>
            <li class="page-item disabled">
                <span class="page-link" th:text="${result.page() + 1} + ' / ' + ${result.totalPages()}"></span>
            </li>
            <li class="page-item" th:classappend="${result.page() + 1 >= result.totalPages()} ? 'disabled'">
                <a class="page-link" th:href="@{/admin/payments(status=${selectedStatus},page=${result.page() + 1})}">&rarr;</a>
            </li>
        </ul>
    </nav>
</main>
<div th:replace="~{admin/fragments :: scripts}"></div>
</body>
</html>
